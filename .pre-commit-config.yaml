# Pre-commit hooks for ckanr.
#
# Install the git hooks once per clone:
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
repos:
  # Generic hygiene (whitespace, file endings, YAML validity, ...).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-merge-conflict
  # R formatter (https://github.com/posit-dev/air).
  # Reformats staged R files in place; re-stage with `git add` if it changes any.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format
